<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Markdown</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-border: rgba(255, 255, 255, 0.1);
            --text: #f0f0f0;
            --text-dim: #888888;
            --accent: #4a90e2;
            --accent-green: #4cae50;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Toolbar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-border);
            user-select: none;
            z-index: 10;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            color: var(--text);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .status-badge.saved {
            color: var(--accent-green);
            background: rgba(76, 174, 80, 0.12);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .stats-counter {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #3b7dc9;
            border-color: #3b7dc9;
        }

        /* Main Editor Layout */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow-y: auto;
            padding: 40px 20px;
        }

        #editor {
            width: 100%;
            max-width: 800px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            line-height: 1.5;
            outline: none;
            caret-color: var(--text);
            text-align: justify;
            min-height: 80vh;
        }

        #editor > div { margin-bottom: 0.6em; min-height: 1.3em; }

        #editor[data-empty="true"]::before {
            content: "Comença a escriure en markdown...";
            color: #444;
            pointer-events: none;
            position: absolute;
        }

        /* Dimmed markdown syntax */
        .md-syntax {
            opacity: 0.25;
            font-size: 0.8em;
            font-weight: normal;
            font-style: normal;
        }

        /* Block-level styles */
        .line-h1 { font-size: 2em; font-weight: bold; line-height: 1.15; margin-top: 0.5em; }
        .line-h2 { font-size: 1.4em; font-weight: bold; line-height: 1.2; margin-top: 0.4em; }
        .line-h3 { font-size: 1.2em; font-weight: bold; line-height: 1.25; }
        .line-bq { border-left: 3px solid #555; padding-left: 0.8em; color: #aaa; }
        .line-li { padding-left: 0.5em; }

        /* Inline styles */
        .md-bold { font-weight: bold; }
        .md-italic { font-style: italic; }
        .md-code {
            font-family: Consolas, "Courier New", monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.1em 0.35em;
            border-radius: 3px;
            font-size: 0.85em;
        }
        .md-strike { text-decoration: line-through; opacity: 0.6; }

        /* Custom Scrollbar */
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-track { background: var(--bg); }
        main::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
        main::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
    </style>
</head>
<body>

    <header>
        <div class="header-title-container">
            <span class="header-title">📝 Editor Markdown</span>
            <span id="statusBadge" class="status-badge saved">
                <span class="status-dot"></span>
                <span id="statusText">Guardat a localStorage</span>
            </span>
        </div>

        <div class="toolbar-actions">
            <span id="statsCounter" class="stats-counter">0 paraules · 0 caràcters</span>
            <button id="btnOpen" class="btn" title="Obrir fitxer local (.md)">📂 Obrir fitxer</button>
            <button id="btnLink" class="btn btn-primary" title="Vincular i desar en un fitxer local en temps real">💾 Vincular fitxer local</button>
            <button id="btnExport" class="btn" title="Descarregar com a notes.md">⬇️ Descarregar .md</button>
        </div>
    </header>

    <main>
        <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true" lang="ca" data-empty="true"></div>
    </main>

    <input type="file" id="fallbackFileInput" accept=".md,.txt,.markdown" style="display:none">

    <script>
        const editor = document.getElementById('editor');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const statsCounter = document.getElementById('statsCounter');
        const btnOpen = document.getElementById('btnOpen');
        const btnLink = document.getElementById('btnLink');
        const btnExport = document.getElementById('btnExport');
        const fallbackFileInput = document.getElementById('fallbackFileInput');

        const STORAGE_KEY = 'simple_editor_content';
        let saveTimeout;
        let fileHandle = null; // File System Access API handle

        document.execCommand('defaultParagraphSeparator', false, 'div');

        // ---- Caret save / restore ----

        function saveCaretPos(el) {
            const sel = window.getSelection();
            if (!sel.rangeCount || !el.contains(sel.focusNode)) return null;
            const r = document.createRange();
            r.selectNodeContents(el);
            r.setEnd(sel.focusNode, sel.focusOffset);
            return r.toString().length;
        }

        function restoreCaretPos(el, offset) {
            if (offset === null) return;
            const sel = window.getSelection();
            const r = document.createRange();
            let cur = 0;
            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                const n = walker.currentNode;
                const len = n.textContent.length;
                if (cur + len >= offset) {
                    r.setStart(n, offset - cur);
                    r.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(r);
                    return;
                }
                cur += len;
            }
            r.selectNodeContents(el);
            r.collapse(false);
            sel.removeAllRanges();
            sel.addRange(r);
        }

        // ---- Active block ----

        function getActiveBlock() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            let node = sel.focusNode;
            if (node === editor) return editor.children[sel.focusOffset] || editor.lastElementChild;
            while (node && node.parentNode !== editor) node = node.parentNode;
            return (node && node.parentNode === editor) ? node : null;
        }

        // ---- HTML escape ----

        function esc(t) {
            return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ---- Decoration engine ----

        function buildDecoration(raw) {
            let cls = '';
            let prefix = '';
            let content = raw;

            // Block-level patterns
            const blocks = [
                [/^(#{1,6}) (.*)$/, m => {
                    cls = 'line-h' + Math.min(m[1].length, 3);
                    prefix = `<span class="md-syntax">${esc(m[1])} </span>`;
                    content = m[2];
                }],
                [/^(> )(.*)$/, m => {
                    cls = 'line-bq';
                    prefix = `<span class="md-syntax">${esc(m[1])}</span>`;
                    content = m[2];
                }],
                [/^([-*+] )(.*)$/, m => {
                    cls = 'line-li';
                    prefix = `<span class="md-syntax">${esc(m[1])}</span>`;
                    content = m[2];
                }],
                [/^(\d+\. )(.*)$/, m => {
                    cls = 'line-li';
                    prefix = `<span class="md-syntax">${esc(m[1])}</span>`;
                    content = m[2];
                }],
            ];

            for (const [re, handler] of blocks) {
                const m = raw.match(re);
                if (m) { handler(m); break; }
            }

            // Escape content, then apply inline decorations
            let html = esc(content);

            // Bold + Italic: ***text***
            html = html.replace(/(\*\*\*)(.+?)(\*\*\*)/g,
                '<span class="md-syntax">$1</span><span class="md-bold md-italic">$2</span><span class="md-syntax">$3</span>');
            // Bold: **text**
            html = html.replace(/(\*\*)(?!\*)(.+?)(?<!\*)(\*\*)/g,
                '<span class="md-syntax">$1</span><span class="md-bold">$2</span><span class="md-syntax">$3</span>');
            // Italic: *text*
            html = html.replace(/(?<!\*)(\*)(?!\*)(.+?)(?<!\*)(\*)(?!\*)/g,
                '<span class="md-syntax">$1</span><span class="md-italic">$2</span><span class="md-syntax">$3</span>');
            // Code: `text`
            html = html.replace(/(`)(.+?)(`)/g,
                '<span class="md-syntax">$1</span><span class="md-code">$2</span><span class="md-syntax">$3</span>');
            // Strikethrough: ~~text~~
            html = html.replace(/(~~)(.+?)(~~)/g,
                '<span class="md-syntax">$1</span><span class="md-strike">$2</span><span class="md-syntax">$3</span>');

            return { html: prefix + html, cls };
        }

        function decorateBlock(block) {
            if (!block || block === editor) return;
            const text = block.textContent;

            if (!text) {
                block.innerHTML = '<br>';
                block.className = '';
                return;
            }

            const caret = saveCaretPos(block);
            const { html, cls } = buildDecoration(text);
            block.innerHTML = html;
            block.className = cls;
            restoreCaretPos(block, caret);
        }

        // ---- Placeholder & Stats ----

        function updatePlaceholderAndStats() {
            const text = editor.textContent;
            editor.setAttribute('data-empty', text.trim() === '' ? 'true' : 'false');

            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            statsCounter.textContent = `${words} paraules · ${chars} caràcters`;
        }

        // ---- Save / Load Core ----

        function getMarkdown() {
            return Array.from(editor.children).map(b => b.textContent).join('\n\n');
        }

        async function saveContent() {
            const md = getMarkdown();
            
            // Always save to localStorage
            localStorage.setItem(STORAGE_KEY, md);

            // If a local file is linked via File System Access API, write to it
            if (fileHandle) {
                try {
                    const writable = await fileHandle.createWritable();
                    await writable.write(md);
                    await writable.close();
                    updateStatus(`Guardat a ${fileHandle.name}`, true);
                } catch (err) {
                    console.error('Error guardant a disc:', err);
                    updateStatus('Guardat a localStorage (error disc)', true);
                }
            } else {
                updateStatus('Guardat a localStorage', true);
            }
        }

        function updateStatus(message, isSaved = true) {
            statusText.textContent = message;
            if (isSaved) {
                statusBadge.classList.add('saved');
            } else {
                statusBadge.classList.remove('saved');
            }
        }

        function loadIntoEditor(md) {
            editor.innerHTML = '';
            if (!md || !md.trim()) {
                const div = document.createElement('div');
                div.innerHTML = '<br>';
                editor.appendChild(div);
                updatePlaceholderAndStats();
                return;
            }
            md.split(/\n/).filter(l => l.trim() !== '').forEach(line => {
                const div = document.createElement('div');
                div.textContent = line;
                editor.appendChild(div);
                decorateBlock(div);
            });
            updatePlaceholderAndStats();
        }

        // ---- Initial Load (localStorage) ----
        const savedInitial = localStorage.getItem(STORAGE_KEY) || '';
        loadIntoEditor(savedInitial);

        // ---- Input Handlers ----

        editor.addEventListener('input', (e) => {
            const block = getActiveBlock();

            if (e.inputType === 'insertParagraph' && block) {
                if (block.previousElementSibling) decorateBlock(block.previousElementSibling);
                decorateBlock(block);
            } else if (block) {
                decorateBlock(block);
            }

            updatePlaceholderAndStats();
            updateStatus('Escrivint...', false);
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
        });

        // ---- Em dash: -- → — ----

        editor.addEventListener('keydown', (e) => {
            if (e.key !== '-') return;
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            if (range.startContainer.nodeType !== Node.TEXT_NODE) return;

            const text = range.startContainer.textContent;
            const off = range.startOffset;
            if (off < 1 || text[off - 1] !== '-') return;

            e.preventDefault();
            const node = range.startContainer;
            node.textContent = text.substring(0, off - 1) + '—' + text.substring(off);

            const r = document.createRange();
            r.setStart(node, off);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);

            const block = getActiveBlock();
            if (block) decorateBlock(block);

            updateStatus('Escrivint...', false);
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
        });

        // ---- Paste Plain Text ----

        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
        });

        // ---- File Actions (File System Access API & Fallbacks) ----

        btnOpen.addEventListener('click', async () => {
            if ('showOpenFilePicker' in window) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'Fitxers Markdown',
                            accept: { 'text/markdown': ['.md', '.markdown', '.txt'] }
                        }],
                        multiple: false
                    });
                    fileHandle = handle;
                    const file = await fileHandle.getFile();
                    const text = await file.text();
                    loadIntoEditor(text);
                    await saveContent();
                } catch (err) {
                    if (err.name !== 'AbortError') console.error(err);
                }
            } else {
                fallbackFileInput.click();
            }
        });

        fallbackFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                loadIntoEditor(evt.target.result);
                saveContent();
            };
            reader.readAsText(file);
        });

        btnLink.addEventListener('click', async () => {
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'notes.md',
                        types: [{
                            description: 'Fitxer Markdown',
                            accept: { 'text/markdown': ['.md'] }
                        }]
                    });
                    fileHandle = handle;
                    await saveContent();
                } catch (err) {
                    if (err.name !== 'AbortError') console.error(err);
                }
            } else {
                alert("El teu navegador utilitzarà el descarregador. Per autoguardat directe a disc es recomana un navegador basat en Chromium (Chrome, Edge, Brave).");
                btnExport.click();
            }
        });

        btnExport.addEventListener('click', () => {
            const md = getMarkdown();
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileHandle ? fileHandle.name : 'notes.md';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
